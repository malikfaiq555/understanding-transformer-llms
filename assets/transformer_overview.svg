<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#ffffff"/>
  <style>.box{fill:#f6f8fa;stroke:#333;stroke-width:2;rx:14}.title{font:700 20px Arial}.txt{font:15px Arial}.arrow{stroke:#333;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <rect class="box" x="35" y="95" width="170" height="150"/>
  <text class="title" x="72" y="130">Text Input</text><text class="txt" x="60" y="165">Prompt is split</text><text class="txt" x="60" y="188">into tokens</text>
  <line class="arrow" x1="205" y1="170" x2="270" y2="170"/>
  <rect class="box" x="270" y="80" width="190" height="180"/>
  <text class="title" x="300" y="118">Embedding</text><text class="txt" x="296" y="153">Token IDs become</text><text class="txt" x="296" y="176">vectors + position</text><text class="txt" x="296" y="199">information</text>
  <line class="arrow" x1="460" y1="170" x2="525" y2="170"/>
