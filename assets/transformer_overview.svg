  <text class="title" x="558" y="90">Transformer</text><text class="title" x="580" y="115">Blocks</text><text class="txt" x="555" y="155">Attention mixes</text><text class="txt" x="555" y="178">context</text><text class="txt" x="555" y="210">Feedforward stores</text><text class="txt" x="555" y="233">learned patterns</text>
  <line class="arrow" x1="745" y1="170" x2="795" y2="170"/>
  <rect class="box" x="795" y="95" width="85" height="150"/>
  <text class="title" x="808" y="135">LM</text><text class="title" x="805" y="160">Head</text><text class="txt" x="808" y="195">Next</text><text class="txt" x="808" y="218">token</text>
</svg>
